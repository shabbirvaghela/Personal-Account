# Template for `fly launch` / `fly deploy` — optional alternative to
# deploying the backend on Vercel. Rename `app` to something unique before
# deploying — Fly app names are global. No volume/mount needed: all data
# lives in Postgres (Supabase or otherwise) via DATABASE_URL.
app = 'legal-ledger-api'
primary_region = 'sin'

[build]

[env]
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
