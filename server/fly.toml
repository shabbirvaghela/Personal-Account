# Template for `fly launch` / `fly deploy`. Rename `app` to something unique
# before deploying — Fly app names are global.
app = 'legal-ledger-api'
primary_region = 'sin'

[build]

[env]
  PORT = '4000'
  DB_PATH = '/data/legal-ledger.db'

[[mounts]]
  source = 'legal_ledger_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
